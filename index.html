<title>Amelia Otto</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Hanken+Grotesk:wght@300;400;500&display=swap">
<style>
/* Layout: a dark house-lights-down portfolio. Photos carry all the color.
   Quiet header, one framed hero slideshow, masonry wall, photo-essay project pages. */
:root{
  color-scheme: dark;
  --ink:#131110;        /* page */
  --ink-2:#1c1917;      /* raised areas */
  --paper:#eee7dc;      /* text */
  --muted:#a69d91;      /* secondary text */
  --line:#332e29;       /* hairlines */
  --glow:#e8d5b2;       /* hover / focus */
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --body:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{
  background:var(--ink);color:var(--paper);font:300 16px/1.65 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 64px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ink);z-index:30}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--glow);outline-offset:3px}
img{display:block;max-width:100%;height:auto}
.wrap{max-width:1360px;margin:0 auto}

/* draft strip */
.draft{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 0;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;border-bottom:1px solid var(--line)}
.draft a{color:var(--glow);border-bottom:1px solid currentColor}

/* header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:baseline;justify-content:space-between;gap:16px 32px;flex-wrap:wrap;padding-block:18px}
.brand{font:400 28px/1 var(--display);letter-spacing:.01em}
nav{display:flex;gap:6px 28px;flex-wrap:wrap}
nav a{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:4px 0;border-bottom:1px solid transparent}
nav a:hover,nav a[aria-current="page"]{color:var(--paper);border-bottom-color:var(--glow)}

/* hero */
.hero{margin-top:28px;position:relative;height:clamp(300px,min(50vw,calc(100vh - 130px)),720px);width:100%;overflow:hidden;background:var(--ink-2)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 35%;opacity:0;transition:opacity 1.2s ease}
.hero img.on{opacity:1}
.hero .cap{position:absolute;left:0;right:0;bottom:0;padding:48px 24px 20px;background:linear-gradient(to top,rgba(19,17,16,.85),rgba(19,17,16,0));display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hero .cap a{font:italic 400 clamp(20px,2.4vw,30px)/1.2 var(--display)}
.hero .cap small{display:block;font:300 13px/1.4 var(--body);letter-spacing:.06em;color:var(--muted);margin-top:2px;font-style:normal}
.dots{display:flex;gap:8px}
.dots button{width:10px;height:10px;border-radius:50%;border:1px solid var(--paper);background:transparent;padding:0;cursor:pointer}
.dots button[aria-current="true"]{background:var(--paper)}

.intro{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px 64px;padding-block:56px 40px;align-items:end}
.intro h1{font:400 clamp(40px,6vw,84px)/1 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.intro h1 span{display:block;font:italic 400 .42em/1.4 var(--display);color:var(--muted);margin-top:10px}
.intro p{margin:0;font-size:18px;max-width:46ch;color:var(--paper)}
@media(max-width:760px){.intro{grid-template-columns:minmax(0,1fr)}}
@media(max-width:620px){.hero{height:auto;aspect-ratio:4/3;margin-top:20px}.hero .cap{padding:40px 16px 14px}}

h2.sec{font:400 13px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 20px;display:flex;justify-content:space-between;gap:16px;align-items:baseline}
h2.sec a{color:var(--glow)}

/* wall */
.wall{columns:3 300px;column-gap:14px}
.tile{display:block;position:relative;break-inside:avoid;margin:0 0 14px;background:var(--ink-2);overflow:hidden}
.tile img{width:100%;transition:transform .7s ease,filter .4s ease}
.tile .t{position:absolute;inset:auto 0 0 0;padding:44px 16px 14px;background:linear-gradient(to top,rgba(19,17,16,.9),rgba(19,17,16,0));opacity:0;transition:opacity .3s ease}
.tile .t b{display:block;font:italic 400 21px/1.2 var(--display)}
.tile .t span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile:hover img,.tile:focus-visible img{transform:scale(1.025)}
.tile:hover .t,.tile:focus-visible .t{opacity:1}
@media(hover:none){.tile .t{opacity:1}}

/* page heads */
.head{padding-block:48px 28px}
.head h1{font:400 clamp(34px,5vw,64px)/1.05 var(--display);margin:0;text-wrap:balance}
.head .kick{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.head p{color:var(--muted);margin:12px 0 0;max-width:60ch}

/* project */
.credits{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px 36px;margin:28px 0 8px;padding-block:20px;border-block:1px solid var(--line)}
.credits dt{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.credits dd{margin:4px 0 0;font-size:16px}
.note{margin:18px 0 0;font:italic 400 20px/1.4 var(--display);color:var(--glow)}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:28px}
.gal figure{margin:0;min-width:0}
.gal .full{grid-column:1 / -1}
.gal .solo{grid-column:1 / -1;justify-self:center;width:min(100%,640px)}
.gal button{display:block;width:100%;padding:0;border:0;background:var(--ink-2);cursor:zoom-in}
.gal img{width:100%}
@media(max-width:620px){.gal{grid-template-columns:minmax(0,1fr)}}
.nextprev{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-top:56px;padding-top:24px;border-top:1px solid var(--line)}
.nextprev a{font:italic 400 22px/1.3 var(--display)}
.nextprev small{display:block;font:300 11px/1.6 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-style:normal}
.back{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.back:hover{color:var(--paper)}

/* sketches */
.skgroup{margin-top:56px}
.skgroup h2{font:400 clamp(24px,3vw,36px)/1.2 var(--display);margin:0}
.skgroup p{margin:4px 0 18px;color:var(--muted)}
.skgrid{columns:4 220px;column-gap:14px}
.skgrid button{display:block;width:100%;margin:0 0 14px;padding:0;border:0;background:#fff;break-inside:avoid;cursor:zoom-in}

/* about */
.about{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:40px 72px;padding-block:8px 24px}
.about p{margin:0 0 1.2em;font-size:18px;max-width:58ch}
.about .facts h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:400}
.about .facts div{margin-bottom:28px;font-size:16px}
.about .facts div p{font-size:16px;margin:0 0 .4em}
.portrait{margin:0 0 28px;max-width:380px}.portrait img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 28%}
.btn{display:inline-block;border:1px solid var(--paper);padding:10px 22px;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.btn[aria-disabled="true"]{border-color:var(--line);color:var(--muted)}
@media(max-width:760px){.about{grid-template-columns:minmax(0,1fr)}}

/* contact / review */
.plain{max-width:60ch;padding-bottom:24px}
.plain p{font-size:18px;margin:0 0 1em}
.todo{border:1px dashed var(--muted);padding:2px 8px;color:var(--glow)}
.review ul{padding-left:1.1em;margin:0 0 28px}
.review li{margin-bottom:6px}
.review h3{font:400 13px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:32px 0 12px}

footer{border-top:1px solid var(--line);margin-top:72px;padding-top:20px;font-size:13px;color:var(--muted);letter-spacing:.06em}

/* lightbox */
#lb{position:fixed;inset:0;background:rgba(10,9,8,.96);z-index:50;display:none;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#lb.open{display:flex}
#lb img{max-height:100%;max-width:100%;object-fit:contain}
#lb button{position:absolute;background:none;border:1px solid var(--line);color:var(--paper);width:44px;height:44px;font-size:20px;cursor:pointer}
#lb .x{top:max(16px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}
#lb .p{left:max(12px,env(safe-area-inset-left,0px));top:50%}
#lb .n{right:max(12px,env(safe-area-inset-right,0px));top:50%}
#lb .c{position:absolute;bottom:max(16px,env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:13px;color:var(--muted);letter-spacing:.08em}

@media (prefers-reduced-motion:reduce){.hero img,.tile img,.tile .t{transition:none}}
</style>

    ${slides.map((x,n)=>`<img src="${x.i.f}" alt="${esc(x.s.title)}" class="${n===0?'on':''}"${HPOS[x.s.slug]?` style="object-position:${HPOS[x.s.slug]}"`:''}>`).join('')}
    <div class="cap"><a id="hcap" href="#work-${slides[0].s.slug}"><span id="htitle">${esc(slides[0].s.title)}</span><small id="hmeta">${esc(meta(slides[0].s))}</small></a>
    <div class="dots">${slides.map((_,n)=>`<button aria-label="Show ${n+1}" aria-current="${n===0}"></button>`).join('')}</div></div>
  </section>
  <section class="intro">
    <h1>Amelia Otto<span>Costume Designer</span></h1>
  </section>
  <h2 class="sec"><span>Selected work</span><a href="#work">All ${D.shows.length} productions</a></h2>
  <div class="wall">${D.shows.slice(0,9).map(tile).join('')}</div>`;
  let cur = 0;
  const imgs = [...$app.querySelectorAll('.hero img')], dots = [...$app.querySelectorAll('.dots button')];
  const show = n => {
    cur = (n+slides.length)%slides.length;
    imgs.forEach((im,k)=>im.classList.toggle('on',k===cur));
    dots.forEach((d,k)=>d.setAttribute('aria-current',k===cur));
    const s = slides[cur].s;
    document.getElementById('hcap').href = '#work-'+s.slug;
    document.getElementById('htitle').textContent = s.title;
    document.getElementById('hmeta').textContent = meta(s);
  };
  dots.forEach((d,k)=>d.addEventListener('click',()=>{show(k);}));
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
    heroTimer = setInterval(()=>show(cur+1),5500);
  }
}

function layoutGallery(imgs, title){
  let out = '', i = 0, idx = 0;
  const portrait = m => m.h > m.w*1.08;
  const fig = (m,cls,n) => `<figure class="${cls}"><button data-n="${n}" aria-label="Open image ${n+1}"><img src="${m.f}" width="${m.w}" height="${m.h}" alt="${esc(title)}, image ${n+1}" loading="lazy"></button></figure>`;
  while(i<imgs.length){
    const m = imgs[i];
    if(!portrait(m)){ out += fig(m,'full',i); i++; }
    else if(imgs[i+1] && portrait(imgs[i+1])){ out += fig(m,'',i)+fig(imgs[i+1],'',i+1); i+=2; }
    else { out += fig(m,'solo',i); i++; }
  }
  return out;
}

  $app.innerHTML = `<div class="head"><a class="back" href="#work">&larr; All work</a>

  bindLightbox(document.getElementById('gal'), s.imgs, s.title);
}

/* lightbox */
const lb = document.getElementById('lb'), lbImg = lb.querySelector('img'), lbC = lb.querySelector('.c');
let lbSet = [], lbTitle = '', lbN = 0, lbReturn = null;
function lbShow(n){ lbN=(n+lbSet.length)%lbSet.length; lbImg.src=lbSet[lbN].f; lbImg.alt=lbTitle; lbC.textContent=lbTitle+' ('+(lbN+1)+' of '+lbSet.length+')'; }
function lbOpen(set,title,n,from){ lbSet=set; lbTitle=title; lbReturn=from; lb.classList.add('open'); lbShow(n); lb.querySelector('.x').focus(); }
function lbClose(){ lb.classList.remove('open'); if(lbReturn) lbReturn.focus(); }
function bindLightbox(root,set,title){ root.addEventListener('click',e=>{ const b=e.target.closest('button[data-n]'); if(b) lbOpen(set,title,+b.dataset.n,b); }); }
lb.querySelector('.x').onclick=lbClose; lb.querySelector('.p').onclick=()=>lbShow(lbN-1); lb.querySelector('.n').onclick=()=>lbShow(lbN+1);
lb.addEventListener('click',e=>{ if(e.target===lb) lbClose(); });
document.addEventListener('keydown',e=>{ if(!lb.classList.contains('open')) return; if(e.key==='Escape') lbClose(); if(e.key==='ArrowLeft') lbShow(lbN-1); if(e.key==='ArrowRight') lbShow(lbN+1); });

/* routing: plain #names, e.g. #work-hair */
function route(){
  clearInterval(heroTimer);
  const h = location.hash.replace(/^#/,'') || 'home';
  if(h==='home') home();
  else if(h==='work') work();
  else if(h.startsWith('work-')) project(h.slice(5));
  else if(h==='sketches') location.replace('#work');
  else if(h==='about') about();
  else if(h==='contact') contact();
  
  else notFound();
  const sec = h.startsWith('work')?'work':h;
  document.querySelectorAll('nav a').forEach(a=>{ if(a.dataset.nav===sec) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
